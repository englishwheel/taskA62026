<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloween Test: Compound Nouns (A6)</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Trebuchet MS', 'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,140,0,.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(138,43,226,.22), transparent 45%),
      #0d0a14;
    margin: 0;
    padding: 24px;
    color: #f3e9ff;
    min-height: 100vh;
  }

  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-decor span {
    position: absolute;
    opacity: .12;
    font-size: 42px;
    animation: float 9s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1) { top: 8%;  left: 6%;  animation-delay: 0s; }
  .bg-decor span:nth-child(2) { top: 20%; right: 8%; animation-delay: 1.4s; font-size: 56px; }
  .bg-decor span:nth-child(3) { bottom: 12%; left: 12%; animation-delay: 2.6s; }
  .bg-decor span:nth-child(4) { bottom: 22%; right: 14%; animation-delay: .7s; font-size: 34px; }
  .bg-decor span:nth-child(5) { top: 46%; left: 3%;  animation-delay: 3.1s; font-size: 30px; }
  .bg-decor span:nth-child(6) { top: 60%; right: 4%;  animation-delay: 1.9s; font-size: 48px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-18px) rotate(4deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a1226 0%, #150f1f 100%);
    padding: 30px 34px 38px;
    border-radius: 16px;
    border: 1px solid rgba(255,140,0,.35);
    box-shadow:
      0 0 0 1px rgba(138,43,226,.25),
      0 10px 40px rgba(0,0,0,.6),
      0 0 60px rgba(255,140,0,.08);
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px;
    color: #ff9e2c;
    text-shadow: 0 0 14px rgba(255,140,0,.55);
    letter-spacing: .5px;
  }

  p.hint {
    color: #b9a8cc;
    font-size: 14px;
    margin: 0 0 18px;
    line-height: 1.5;
  }

  .item {
    margin: 12px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(138,43,226,.15);
    transition: background .2s, border-color .2s;
  }
  .item:hover { background: rgba(255,140,0,.05); border-color: rgba(255,140,0,.3); }

  .sentence {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .num {
    display: inline-block;
    min-width: 26px;
    color: #ffb84d;
    font-weight: 700;
  }
  .highlight {
    font-weight: bold;
    color: #ffb84d;
    background: rgba(255,140,0,.1);
    padding: 0 4px;
    border-radius: 4px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    padding-left: 26px;
  }

  .option-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1.5px solid #4a3a63;
    border-radius: 9px;
    cursor: pointer;
    background: #0f0a17;
    transition: border-color .15s, background .15s, box-shadow .15s;
    font-size: 14px;
  }
  .option-label:hover {
    border-color: #ff9e2c;
    background: rgba(255,140,0,.08);
  }
  .option-label input[type="radio"] {
    accent-color: #ff9e2c;
    cursor: pointer;
  }

  .option-label.correct {
    border-color: #4cd964;
    background: rgba(76,217,100,.10);
    box-shadow: 0 0 10px rgba(76,217,100,.25);
  }
  .option-label.wrong {
    border-color: #ff3b30;
    background: rgba(255,59,48,.12);
    box-shadow: 0 0 10px rgba(255,59,48,.3);
    animation: shake .3s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-4px); }
    75%     { transform: translateX(4px); }
  }

  .buttons {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .4px;
    transition: transform .06s, box-shadow .2s, filter .2s;
  }
  button:active { transform: scale(.97); }

  #checkBtn {
    background: linear-gradient(180deg, #ff9e2c, #e67300);
    color: #1a0f00;
    box-shadow: 0 0 18px rgba(255,140,0,.5);
  }
  #checkBtn:hover { filter: brightness(1.1); box-shadow: 0 0 26px rgba(255,140,0,.75); }

  #resetBtn {
    background: linear-gradient(180deg, #7b4fbf, #5a2e9e);
    color: #f3e9ff;
    box-shadow: 0 0 16px rgba(138,43,226,.45);
  }
  #resetBtn:hover { filter: brightness(1.12); box-shadow: 0 0 24px rgba(138,43,226,.7); }

  #result {
    margin-top: 22px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    display: none;
  }
  #result.pass {
    background: rgba(76,217,100,.12);
    color: #7dff9a;
    border: 1px solid rgba(76,217,100,.4);
    box-shadow: 0 0 22px rgba(76,217,100,.25);
  }
  #result.fail {
    background: rgba(255,59,48,.12);
    color: #ff8a80;
    border: 1px solid rgba(255,59,48,.4);
    box-shadow: 0 0 22px rgba(255,59,48,.25);
  }

  .web {
    position: absolute;
    top: -1px; right: -1px;
    width: 130px; height: 130px;
    opacity: .18;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-decor">
  <span>🦇</span>
  <span>🎃</span>
  <span>🕸️</span>
  <span>👻</span>
  <span>🦇</span>
  <span>🎃</span>
</div>

<div class="container">
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#d9b3ff" stroke-width="1">
    <path d="M100 0 L100 40 M100 0 L60 0 M100 0 L70 30 M100 0 L40 60 M100 0 L20 80"/>
    <path d="M100 15 Q85 15 80 30 M100 30 Q80 28 72 45 M100 45 Q75 42 60 62"/>
  </svg>

  <h1>🎃 Halloween Test: Compound Nouns (A6) 🎃</h1>
  <p class="hint">Выберите правильный вариант ответа. <b>Тест сдан, если ошибок не больше 2</b>. Неправильные ответы загорятся зловещим красным. 👻</p>

  <div id="test"></div>

  <div class="buttons">
    <button id="checkBtn">🕸️ Проверить</button>
    <button id="resetBtn">💀 Сбросить</button>
  </div>
  <div id="result"></div>
</div>

<script>
/* ---------- ДАННЫЕ: 10 ВОПРОСОВ (ТОЧНО ПО СБОРНИКУ) ---------- */
const questions = [
  // ЦЭ Вариант 1
  { 
    text: "The artist set up a course in painting for <span class='highlight'>...</span>, hoping to inspire creativity in everyone who participates.",
    options: ["grown's-up", "grown's-ups", "growns-ups", "grown-ups", "growns-up"],
    correct: 3 // grown-ups
  },
  // ЦЭ Вариант 2
  { 
    text: "During the wedding, my <span class='highlight'>...</span> helped me set up the decorations and organise the seating.",
    options: ["brother-in-law's", "brother's-in-law", "brothers-in-laws", "brother's-in-law's", "brothers-in-law"],
    correct: 0 // brother-in-law's (притяжательный падеж ед.ч.)
  },
  // ЦЭ Вариант 3
  { 
    text: "The kids made up the whole story as they knew the <span class='highlight'>...</span> weren't likely to approve of the truth.",
    options: ["grown-ups", "grown-up's", "growns-up", "grown's-up", "growns-ups"],
    correct: 0 // grown-ups (в скане сборника опечатка, продублированы варианты, но правильный - grown-ups)
  },
  // ЦЭ Вариант 4
  { 
    text: "Both of my <span class='highlight'>...</span> work in the same hospital.",
    options: ["brother-in-law's", "brother's-in-law", "brothers-in-law", "brothers-in-laws", "brother's-in-law's"],
    correct: 2 // brothers-in-law (множественное число)
  },
  // ЦЭ Вариант 5
  { 
    text: "The children laughed and shouted as they rode the colourful <span class='highlight'>...</span> at the amusement park.",
    options: ["merries-go-round", "merry's-go-round", "merry-go-round's", "merry-go-rounds", "merries-go-rounds"],
    correct: 3 // merry-go-rounds
  },
  // ЦТ Вариант 1
  { 
    text: "Do you remember <span class='highlight'>...</span> invitation to join them for the picnic by the sea on Saturday?",
    options: ["Mum and Dad's", "Mums and Dads", "Mum's and Dad's", "Mum's and Dad", "Mum and Dad"],
    correct: 0 // Mum and Dad's (общее владение)
  },
  // ЦТ Вариант 2
  { 
    text: "<span class='highlight'>...</span> engagement has turned out to be a total failure because they have nothing in common.",
    options: ["Rose and Den's", "Rose's and Den's", "Rose's and Den", "Roses and Dens", "Rose and Den"],
    correct: 0 // Rose and Den's (общее владение)
  },
  // ЦТ Вариант 3
  { 
    text: "<span class='highlight'>...</span> first home was a semi-detached house with a garden.",
    options: ["Peter and Sheila's", "Peter's and Sheila", "Peters and Sheila", "Peter's and Sheila's", "Peter and Sheila"],
    correct: 0 // Peter and Sheila's (общее владение)
  },
  // ЦТ Вариант 4
  { 
    text: "If you have a look at <span class='highlight'>...</span> house, it becomes obvious that they have excellent taste.",
    options: ["Mary and Peter's", "Mary's and Peter's", "Marys and Peters", "Mary's and Peter", "Mary and Peter"],
    correct: 0 // Mary and Peter's (общее владение)
  },
  // ЦТ Вариант 5
  { 
    text: "I invented an excuse because I didn't want to go to <span class='highlight'>...</span> party.",
    options: ["Toms and Marys", "Tom's and Mary's", "Tom and Mary", "Tom's and Mary", "Tom and Mary's"],
    correct: 4 // Tom and Mary's (общее владение)
  }
];

/* ---------- НАСТРОЙКА ---------- */
const MAX_MISTAKES = 2; // допускается не более 2 ошибок

/* ---------- РЕНДЕР ---------- */
const testContainer = document.getElementById('test');

questions.forEach((q, i) => {
  const div = document.createElement('div');
  div.className = 'item';
  
  let optionsHTML = '';
  q.options.forEach((opt, optIndex) => {
    optionsHTML += `
      <label class="option-label" id="label_${i}_${optIndex}">
        <input type="radio" name="q${i}" value="${optIndex}" data-question="${i}" onchange="clearItemStyles(${i})">
        ${optIndex + 1}) ${opt}
      </label>
    `;
  });

  div.innerHTML = `
    <div class="sentence">
      <span class="num">${i + 1}.</span> ${q.text}
    </div>
    <div class="options-grid">
      ${optionsHTML}
    </div>
  `;
  testContainer.appendChild(div);
});

function clearItemStyles(qIndex) {
  const labels = document.querySelectorAll(`[id^="label_${qIndex}_"]`);
  labels.forEach(lbl => {
    lbl.classList.remove('correct', 'wrong');
  });
}

/* ---------- ПРОВЕРКА ---------- */
function checkAll() {
  let correctCount = 0;
  let wrongCount = 0;
  let answeredCount = 0;

  questions.forEach((q, i) => {
    const selectedRadio = document.querySelector(`input[name="q${i}"]:checked`);
    
    const labels = document.querySelectorAll(`[id^="label_${i}_"]`);
    labels.forEach(lbl => lbl.classList.remove('correct', 'wrong'));

    if (selectedRadio) {
      answeredCount++;
      const selectedValue = parseInt(selectedRadio.value);
      
      if (selectedValue === q.correct) {
        correctCount++;
        document.getElementById(`label_${i}_${selectedValue}`).classList.add('correct');
      } else {
        wrongCount++;
        document.getElementById(`label_${i}_${selectedValue}`).classList.add('wrong');
      }
    }
  });

  const total = questions.length;
  const result = document.getElementById('result');
  result.style.display = 'block';

  const passed = (answeredCount === total) && (wrongCount <= MAX_MISTAKES);

  if (passed) {
    result.className = 'pass';
    const errWord = wrongCount === 0 ? 'ни одной ошибки' : (wrongCount === 1 ? '1 ошибка' : `${wrongCount} ошибки`);
    result.textContent = `Тест сдан! ✅ Правильно: ${correctCount}/${total}, ${errWord} (допускается до ${MAX_MISTAKES}). 🎃👻🦇`;
  } else {
    result.className = 'fail';
    let msg = '';
    if (answeredCount < total) {
      msg = `Отвечено ${answeredCount} из ${total}. Ответьте на все вопросы. `;
    }
    msg += `Ошибок: ${wrongCount} (допускается не больше ${MAX_MISTAKES}). Исправьте красные поля и проверьте снова. 💀`;
    result.textContent = msg;
  }
}

/* ---------- СБРОС ---------- */
function resetAll() {
  document.querySelectorAll('input[type="radio"]').forEach(radio => {
    radio.checked = false;
  });
  
  document.querySelectorAll('.option-label').forEach(lbl => {
    lbl.classList.remove('correct', 'wrong');
  });

  const result = document.getElementById('result');
  result.style.display = 'none';
  result.textContent = '';
  result.className = '';
}

document.getElementById('checkBtn').addEventListener('click', checkAll);
document.getElementById('resetBtn').addEventListener('click', resetAll);
</script>
</body>
</html>
